name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run, for a run lost to a platform incident rather than a code
  # change. GitHub only offers the Run workflow button once this file is on the
  # default branch, so it becomes usable after this branch merges.
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The validator declares PyYAML in its inline script metadata; uv
      # supplies it.
      - uses: astral-sh/setup-uv@v10
      - run: uv run scripts/validate-config.py
