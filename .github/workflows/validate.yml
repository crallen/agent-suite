name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run, for a run lost to a platform incident rather than a code
  # change. GitHub only offers the Run workflow button once this file is on the
  # default branch, so it becomes usable after this branch merges.
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # PyYAML is optional for the validator, but installing it enables the
      # frontmatter-validity check.
      - run: pip install pyyaml
      # Covers reference integrity, index accuracy, and claude<->opencode parity.
      - run: scripts/validate-config.py
      # shellcheck ships on the runner image.
      - run: shellcheck scripts/*.sh
