# Routing cases: each prompt should load the named skill or agent within the
# first few tool calls, in an empty scratch directory unless the entry names a
# fixture.
#
# Shapes:
#   {prompt, expect: <name>}         the route must include <name>
#   {prompt, any_of: [<name>, ..]}   genuine overlap between skills; any counts
#   {prompt, expect: none}           no skill or agent should load
#
# Optional key:
#   fixture: <path under evals/>     a directory with before/ and optional
#                                    after/, set up like a behavior fixture
#                                    (before/ committed, after/ unstaged), so a
#                                    request to review or debug has a repo
#
# Write prompts the way a user types them in a repo: concrete, specific, often
# terse. Never reuse or paraphrase a target's description; a prompt that echoes
# the description passes without proving anything. Ask for work, not advice:
# a question gets answered inline with nothing loaded. Without a fixture the
# prompt must be self-contained, so paste the snippet it acts on.
#
# Agent entries use expect: <agent> and ask for what the agent enforces (read-
# only review, an isolated investigation, a cheaper model, a browser). An any_of
# pairing an agent with its own skill passes on the skill load alone, so it
# tests nothing about agent routing. Use any_of only where every listed target
# is honestly correct, not to make a case easier.
#
# Known gaps: an entry marked `# known gap` is a prompt users do type that loads
# nothing today. It FAILs on both sides by design; that FAIL is the backlog for
# improving the target's description, and a fix shows up as FIXED. Its
# work-shaped sibling follows it with the same target. Repeated targets get
# numbered ids in file order (routing/doc-templates-1, routing/doc-templates-2).
#
# Order: skills alphabetically, then Claude agents, then negatives.

