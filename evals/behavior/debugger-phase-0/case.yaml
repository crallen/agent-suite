# Guards debugging-methodology Phase 0: the debugger runs a red-capable command
# before it touches code. The fixture's failing test is that command, so the first
# `python3 -m unittest` run must come before the first Edit or Write.
# Red proof: delete "Phase 0" from skills/debugging-methodology/SKILL.md.
#
# The prompt reports the symptom only and never mentions the tests, so running
# them first comes from the methodology, not from the prompt. Only the test suite
# is runnable (no bare `python3`), which keeps the loop observable as a `unittest`
# call and closes editing files through a Python one-liner instead of Edit.
prompt: >-
  A customer emailed us: they ordered exactly 10 widgets at $2.50 each and the
  invoice charged them $25.00 for the widgets. Our site says orders of 10 or more
  get 10% off, so they expected $22.50. Can you fix it?
agent: debugger
allowed_tools:
  - "Bash(python3 -m unittest*)"
  - Read
  - Glob
  - Grep
  - Edit
timeout: 300
assert:
  # `before` names one tool, so the Edit/Write pair is two assertions.
  - order:
      first: "Bash:unittest"
      before: Edit
  - order:
      first: "Bash:unittest"
      before: Write
